# AI Workflow V2 acceptance pipeline — ACTIVE GitHub Actions workflow.
#
# Canonical copy lives at ci/github-actions.yml; keep the two in sync.
# Runs ci/pipeline.sh on every push / PR to main, plus manual dispatch.
# The pipeline never runs project commands and never runs the AI agent loop.

name: v2-acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ruby

      - name: Install shellcheck (macos)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Run V2 acceptance pipeline
        run: bash ci/pipeline.sh --require-shellcheck
