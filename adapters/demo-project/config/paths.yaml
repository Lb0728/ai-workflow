schema_version: 1

paths:
  project:
    base: project_root
    repository_rules: AGENTS.md
    docs_index: docs/README.md
    target_architecture: docs/target_architecture.md
    current_architecture_status: docs/current_status.md
    architecture_progress: docs/progress.md
    current_architecture_deep_dive: docs/current_deep_dive.md
    ai_link: .ai-demo-project

  workflow:
    base: workflow_root
    legacy_agents: agents
    legacy_skills: skills
    legacy_workflows: workflows
    legacy_templates: templates
    legacy_tools: tool
    legacy_tasks: tasks

  core_assets:
